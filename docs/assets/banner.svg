<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0f2b38" />
      <stop offset="100%" stop-color="#071520" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Geometric Grid & Circuit Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="1020" cy="180" r="160" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="300" r="140" fill="#06b6d4" opacity="0.08" filter="url(#glow)" />

  <!-- Badge Top -->
  <rect x="80" y="55" width="230" height="32" rx="16" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="98" cy="71" r="5" fill="#10b981" />
  <text x="114" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#34d399" letter-spacing="0.5">AGRITECH PLATFORM</text>

  <!-- Title and Subtitle -->
  <text x="80" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Machine-Day Composer
  </text>
  <text x="80" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Custom Hiring Centre (CHC) Machinery Scheduling &amp; Breakdown Recovery Platform
  </text>

  <!-- Highlight Pill Tags -->
  <g transform="translate(80, 230)">
    <!-- Pill 1: FastAPI -->
    <rect x="0" y="0" width="115" height="34" rx="8" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="57" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ FastAPI</text>

    <!-- Pill 2: PostgreSQL -->
    <rect x="125" y="0" width="150" height="34" rx="8" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="200" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🐘 PostgreSQL 16</text>

    <!-- Pill 3: SQLAlchemy 2.0 -->
    <rect x="285" y="0" width="160" height="34" rx="8" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="365" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚙️ SQLAlchemy 2.x</text>

    <!-- Pill 4: Haversine Geo -->
    <rect x="455" y="0" width="170" height="34" rx="8" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="540" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">📍 Geodesic Routing</text>

    <!-- Pill 5: Argon2id + JWT -->
    <rect x="635" y="0" width="150" height="34" rx="8" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="710" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔐 Argon2id Auth</text>
  </g>

  <!-- Right Side Visual / Machinery Vector Art -->
  <g transform="translate(900, 100)">
    <!-- Glass Shield Graphic -->
    <rect x="-10" y="-10" width="220" height="200" rx="20" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.5" />
    
    <!-- Stylized Tractor & Shield Symbol -->
    <path d="M40,130 C40,110 55,95 75,95 C95,95 110,110 110,130 Z" fill="none" stroke="#34d399" stroke-width="4" />
    <circle cx="75" cy="130" r="28" fill="none" stroke="#34d399" stroke-width="4" />
    <circle cx="75" cy="130" r="12" fill="#10b981" opacity="0.6" />

    <circle cx="155" cy="138" r="18" fill="none" stroke="#06b6d4" stroke-width="4" />
    <circle cx="155" cy="138" r="7" fill="#06b6d4" opacity="0.6" />

    <!-- Tractor Hood & Cab -->
    <path d="M75,95 L75,55 L130,55 L150,85 L175,85 L175,138" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
    <path d="M125,55 L125,85 L85,85" fill="none" stroke="#38bdf8" stroke-width="3" />
    <line x1="165" y1="85" x2="165" y2="45" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

    <!-- Pulse status light -->
    <circle cx="180" cy="20" r="6" fill="#10b981" filter="url(#glow)" />
    <text x="165" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="end">ONLINE</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#accent-grad)" />
</svg>
